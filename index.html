<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台語外來詞大挑戰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://tauhu.tw/tauhu-oo.css" rel="stylesheet">
<style>
:root {
  --primary: #111111;
  --primary-light: #fff6d6;
  --accent: #ffcc00;
  --bg: #ffffff;
  --text: #111111;
  --card-bg: #ffffff;
  --correct: #1b7a34;
  --correct-bg: #e6f4ea;
  --wrong: #c62828;
  --wrong-bg: #fdeaea;
  --border: #111111;
  --border-soft: #d8d8d8;
}
* { box-sizing: border-box; font-family: tauhu-oo, 'Noto Sans TC', sans-serif; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); }
.app { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; }

.hero-banner {
  width: 100%;
  background: var(--primary);
  color: var(--accent); padding: 16px 20px; text-align: center;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  border-bottom: 6px solid var(--accent);
  line-height: 0;
}
.hero-banner.hidden { display: none; }
.hero-banner h1 { margin: 0; font-size: 2rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.hero-banner .subtitle { margin-top: 8px; font-size: 1rem; color: #ffffff; line-height: 1; }

.screen { width: 100%; max-width: 640px; padding: 30px 20px 60px; }
.screen.hidden { display: none; }

.count-label { font-weight: 800; color: var(--primary); margin-bottom: 12px; text-align: center; font-size: 1.05rem; }
.count-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 26px; }
.count-btn {
  background: white; border: 2px solid var(--primary); border-radius: 14px;
  padding: 18px 10px; text-align: center; font-weight: 800; font-size: 1.1rem;
  color: var(--primary); cursor: pointer; transition: all .15s ease;
}
.count-btn:hover { border-color: var(--accent); background: var(--primary-light); }
.count-btn.selected { background: var(--primary); color: var(--accent); border-color: var(--primary); transform: scale(1.03); }
.count-btn .count-sub { display: block; font-size: 0.72rem; font-weight: 500; margin-top: 4px; opacity: 0.8; }

.start-btn {
  display: block; width: 100%; background: var(--accent); color: var(--primary); border: 2px solid var(--primary);
  padding: 16px; border-radius: 28px; font-weight: 900; font-size: 1.15rem; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2); transition: opacity .15s ease, transform .15s ease;
}
.start-btn:disabled { background: #eeeeee; color: #999; border-color: var(--border-soft); box-shadow: none; cursor: not-allowed; opacity: 0.8; }
.start-btn:not(:disabled):hover { transform: translateY(-1px); }

.last-score {
  text-align: center; margin-top: 22px; padding: 12px 16px; border-radius: 12px;
  background: var(--primary-light); color: var(--primary); font-weight: 800; display: none;
  border: 2px solid var(--accent);
}
.last-score.show { display: block; }

.rules-box { margin-top: 30px; background: white; border: 2px solid var(--primary); border-radius: 12px; padding: 16px 18px; font-size: 0.85rem; color: #333; }
.rules-box li { margin-bottom: 6px; }

/* --- 遊戲畫面 --- */
.game-header {
  text-align: center; color: #888888; font-weight: 700;
  margin-bottom: 10px;
  font-size: clamp(0.7rem, 2.6vw, 1.05rem);
}
.progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; font-weight: 800; color: var(--primary); }
.progress-bar-track { background: #eeeeee; border-radius: 10px; height: 8px; overflow: hidden; margin-bottom: 26px; border: 1px solid var(--primary); }
.progress-bar-fill { background: var(--accent); height: 100%; width: 0%; transition: width .3s ease; }

.question-card { background: white; border: 2px solid var(--primary); border-radius: 16px; padding: 26px 22px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
.qa-left, .qa-right { min-width: 0; }
.tailo-word {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 2rem; font-weight: 900; color: var(--primary);
  padding: 6px 18px; border-radius: 14px; background: var(--primary-light);
  margin-bottom: 26px; border: 2px solid var(--accent);
}
.tailo-word:hover { background: var(--accent); }
.tailo-word .spk { font-size: 1.4rem; }

.opt-list { display: flex; flex-direction: column; gap: 12px; }
@media (orientation: portrait) {
  .opt-list { display: flex; flex-direction: column; gap: 12px; }
}
.opt-btn {
  display: flex; align-items: center; gap: 12px; text-align: left;
  background: white; border: 2px solid var(--primary); border-radius: 12px;
  padding: 14px 16px; font-size: 1rem; cursor: pointer; color: var(--text);
}
.opt-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--accent); }
.opt-letter {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: var(--primary);
  color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 900;
}
.opt-btn.correct { background: var(--correct-bg); border-color: var(--correct); }
.opt-btn.correct .opt-letter { background: var(--correct); color: white; }
.opt-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); }
.opt-btn.wrong .opt-letter { background: var(--wrong); color: white; }
.opt-btn:disabled { cursor: default; }

.feedback-banner {
  margin-top: 18px; text-align: center; font-weight: 900; font-size: 1.1rem; min-height: 28px;
}
.explain-box {
  display: none; margin-top: 10px; text-align: left; background: var(--primary-light);
  border: 2px solid var(--accent); border-radius: 10px; padding: 12px 16px; font-size: 0.9rem; color: #333;
}
.explain-box.show { display: block; }
.explain-box .explain-title { font-weight: 900; color: var(--primary); margin-bottom: 4px; }

.nav-row { display: flex; gap: 12px; margin-top: 22px; }
.nav-btn {
  flex: 1 1 0; background: white; color: var(--primary); border: 2px solid var(--primary);
  padding: 13px; border-radius: 24px; font-weight: 800; font-size: 1rem; cursor: pointer;
}
.nav-btn:hover:not(:disabled) { background: var(--primary-light); }
.nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.nav-btn.primary { background: var(--primary); color: var(--accent); }
.nav-btn.primary:hover:not(:disabled) { background: #000; }

/* 橫式螢幕：左（詞卡＋選項）右（對錯提示＋釋義）雙欄配置。
   寬度盡量撐滿畫面（減少四周留白），字體與間距改用 clamp() 依螢幕可視範圍（vh／vw）
   等比例縮放——螢幕越大物件跟字就越大，螢幕越窄矮就自動縮小，確保不需捲動。
   此區塊放在樣式表最後，確保能覆蓋掉前面同層級選擇器的預設值。 */
@media (orientation: landscape) {
  .app { justify-content: center; }
  .screen { max-width: min(96vw, 1600px); padding: clamp(3px, 1vh, 12px) clamp(12px, 2vw, 30px) clamp(4px, 1vh, 12px); }
  .game-header { font-size: clamp(0.65rem, 2.2vh, 1rem); margin-bottom: clamp(2px, 0.6vh, 8px); }
  .progress-row { margin-bottom: clamp(2px, 0.6vh, 8px); font-size: clamp(1.6rem, 4.8vh, 2.3rem); }
  .progress-bar-track { margin-bottom: clamp(4px, 1vh, 12px); height: clamp(5px, 1vh, 10px); }

  .question-card {
    padding: clamp(8px, 1.8vh, 24px) clamp(18px, 3vw, 44px) clamp(6px, 1.4vh, 16px);
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    grid-template-areas: "left right" "nav nav";
    column-gap: clamp(20px, 3.5vw, 56px);
    row-gap: clamp(3px, 1vh, 10px);
    align-items: start;
  }
  .qa-left { grid-area: left; text-align: center; }
  .qa-right { grid-area: right; text-align: left; display: flex; flex-direction: column; justify-content: center; min-height: 100%; }
  .nav-row { grid-area: nav; margin-top: clamp(3px, 0.8vh, 10px); gap: clamp(10px, 1.6vw, 20px); }

  /* 所有文字放大一倍：font-size 的 clamp 上下限與 vh 係數皆為原本的 2 倍；
     其餘留白／間距則進一步壓縮，換取字體加倍後仍可完整顯示、不需捲動的空間。 */
  .tailo-word {
    font-size: clamp(3rem, 11vh, 5.6rem);
    padding: clamp(3px, 1vh, 12px) clamp(18px, 2.8vw, 38px);
    margin-bottom: clamp(5px, 1.4vh, 16px);
  }
  .tailo-word .spk { font-size: clamp(2.2rem, 6.4vh, 3.4rem); }

  .opt-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(5px, 1.2vh, 14px); }
  .opt-btn { padding: clamp(5px, 1.4vh, 16px) clamp(12px, 1.6vw, 24px); font-size: clamp(1.7rem, 4.2vh, 2.4rem); gap: clamp(10px, 1.4vw, 18px); }
  .opt-letter { width: clamp(36px, 7vh, 66px); height: clamp(36px, 7vh, 66px); font-size: clamp(1.5rem, 3.4vh, 2rem); }

  .feedback-banner { margin-top: 0; font-size: clamp(1.9rem, 5vh, 2.8rem); min-height: auto; text-align: left; }
  .explain-box { margin-top: clamp(2px, 0.8vh, 10px); padding: clamp(5px, 1.2vh, 14px) clamp(12px, 1.6vw, 22px); font-size: clamp(1.4rem, 3.6vh, 2.1rem); }
  .explain-box .explain-title { font-size: clamp(1.6rem, 4vh, 2.2rem); margin-bottom: clamp(1px, 0.4vh, 5px); }

  .nav-btn { padding: clamp(5px, 1.2vh, 16px); font-size: clamp(1.76rem, 4vh, 2.3rem); }
}

@media (orientation: landscape) and (max-height: 460px) {
  .explain-box { max-height: 30vh; overflow-y: auto; padding: 4px 10px; margin-top: 2px; }
  .game-header { font-size: 0.6rem; margin-bottom: 2px; }
  .screen { padding-top: 2px; padding-bottom: 4px; }
  .progress-row { margin-bottom: 2px; }
  .progress-bar-track { margin-bottom: 3px; }
  .question-card { padding: 4px 18px 4px; row-gap: 2px; }
  .tailo-word { margin-bottom: 3px; padding: 2px 14px; }
  .opt-list { gap: 3px; }
  .opt-btn { padding: 3px 10px; }
  .nav-row { margin-top: 2px; }
  .nav-btn { padding: 3px; }
}

/* 直式螢幕：遊戲頁面內物件間距整體縮小，把空間留給題卡本身。
   只作用在遊戲頁面（#screen-game），不影響入口頁的版面。 */
@media (orientation: portrait) {
  #screen-game { padding: 14px 16px 20px; }
  #screen-game .game-header { font-size: clamp(0.7rem, 3.6vw, 0.95rem); margin-bottom: 8px; }
  #screen-game .progress-row { margin-bottom: 8px; }
  #screen-game .progress-bar-track { margin-bottom: 12px; }
  #screen-game .question-card { padding: 16px 16px; display: flex; flex-direction: column; }
  #screen-game .tailo-word { margin-bottom: 14px; }
  #screen-game .opt-list { gap: 8px; }
  /* 「上一題」「下一題」移到「選項」與「對錯提示／釋義」之間 */
  #screen-game .nav-row { order: 2; margin: 14px 0; gap: 10px; }
  #screen-game .qa-right { order: 3; }
  #screen-game .feedback-banner { margin-top: 0; min-height: 20px; }
  #screen-game .explain-box { margin-top: 6px; padding: 10px 14px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="hero-banner" id="hero-banner">
    <h1>台語外來詞大挑戰</h1>
    <div class="subtitle">臺中明道中學 詹宗龍 製作</div>
  </div>

  <div class="screen" id="screen-entry">
    <div class="count-label">請選擇題數</div>
    <div class="count-grid" id="count-grid"></div>
    <button class="start-btn" id="start-btn" disabled onclick="startChallenge()">開始挑戰</button>
    <div class="last-score" id="last-score"></div>
    <div class="rules-box">
      <ul>
        <li>🎲 題目會隨機出現，全部題號輪過一輪之後才會再重複。</li>
        <li>🔊 點擊題目中央的臺羅字詞，可以聽官方讀音。</li>
        <li>✅ 答對會有正確音效，並顯示釋義說明；❌ 答錯會有錯誤音效，可以繼續作答。</li>
        <li>⬅️➡️ 「上一題」「下一題」按鈕隨時可以使用，自由切換題目。</li>
      </ul>
    </div>
  </div>

  <div class="screen hidden" id="screen-game">
    <div class="game-header">臺中明道中學 詹宗龍 製作</div>
    <div class="progress-row">
      <span id="progress-text">第 1 / 5 題</span>
      <span id="score-text">答對 0 題</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="question-card">
      <div class="qa-left">
        <div class="tailo-word" id="tailo-word" onclick="playCurrentAudio()">
          <span id="tailo-text"></span><span class="spk">🔊</span>
        </div>
        <div class="opt-list" id="opt-list"></div>
      </div>
      <div class="qa-right">
        <div class="feedback-banner" id="feedback-banner"></div>
        <div class="explain-box" id="explain-box">
          <div class="explain-title">📖 釋義</div>
          <div id="explain-text"></div>
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prev-btn" onclick="prevQuestion()">⬅️ 上一題</button>
        <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()">下一題 ➡️</button>
      </div>
    </div>
  </div>

 "opts": ["高爾夫球", "上等、高級", "圍裙", "網球"], "ans": 3, "explain": "網球。借自日語「テニス(tenisu)」。"}, {"id": 159, "term": "thia̋n-pú-lah", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/CG/wC/205221.mp3", "opts": ["甜不辣", "飯盒", "優惠、額外優待", "小船"], "ans": 0, "explain": "甜不辣。借自日語「天麩羅（テンプラ）(tenpura)」。"}, {"id": 160, "term": "thoo-lá-khuh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/SA/dg/205231.mp3", "opts": ["阿斯匹林", "洋火腿", "卡車", "啤酒"], "ans": 2, "explain": "卡車。借自日語「トラック(torakku)」。"}, {"id": 161, "term": "thoo-má-tooh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/YK/Bk/205241.mp3", "opts": ["秋刀魚", "照相機、開麥拉", "番茄、西紅柿", "乾脆、阿莎力"], "ans": 2, "explain": "番茄、西紅柿。借自日語「トマト(tomato)」。"}, {"id": 162, "term": "tòo-sàng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/Zt/MP/205251.mp3", "opts": ["麥克風", "乾脆、阿莎力", "無袖背心", "多桑、父親"], "ans": 3, "explain": "多桑、父親。借自日語「父さん（とうさん）(toosan)」。"}, {"id": 163, "term": "tshia̋n-pá-lah", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/wI/Nj/205261.mp3", "opts": ["目錄", "紅蘿蔔", "卡拉OK", "兒童模擬武打戲的、日本古裝武打戲"], "ans": 3, "explain": "兒童模擬武打戲的、日本古裝武打戲。借自日語「ちゃんばら(chanbara)」。"}, {"id": 164, "term": "tsiok-kih", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/hw/g9/205271.mp3", "opts": ["小費", "球棒", "乾脆、阿莎力", "剪刀"], "ans": 3, "explain": "剪刀。借自日語「チョッキ(chokki)」。"}, {"id": 165, "term": "tsioo-kóo-lè-tòo", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/Pv/zQ/205281.mp3", "opts": ["巧克力", "探戈", "疊蓆、塌塌米", "里脊肉"], "ans": 0, "explain": "巧克力。借自日語「チョコレート(chokoreeto)」。"}, {"id": 166, "term": "tsit-puh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/HB/FC/205291.mp3", "opts": ["小費", "烏龍麵", "螺絲起子", "啤酒"], "ans": 0, "explain": "小費。借自日語「チップ(chippu)」。"}, {"id": 167, "term": "u-lóng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/hY/Yl/205301.mp3", "opts": ["番茄、西紅柿", "潤飾、修飾", "安全、放心、沒問題", "烏龍麵"], "ans": 3, "explain": "烏龍麵。借自日語「饂飩（うどん）(udon)」。"}, {"id": 168, "term": "ua-khá-móo-tooh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/kX/tQ/205311.mp3", "opts": ["一種保健藥品", "馬達", "飯店、旅社", "探戈"], "ans": 0, "explain": "一種保健藥品。借自日語「わかもと(wakamoto)」。"}, {"id": 169, "term": "ua-lù-tsuh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/Np/i9/205321.mp3", "opts": ["拉鍊", "華爾茲", "杯子", "球拍"], "ans": 1, "explain": "華爾茲。借自日語「ワルツ(warutsu)」。"}, {"id": 170, "term": "ua-sá-bih", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/Wr/7m/205331.mp3", "opts": ["脫衣舞", "方向盤", "打火機", "芥末、山葵醬"], "ans": 3, "explain": "芥末、山葵醬。借自日語「山葵（わさび）(wasabi)」。"}, {"id": 171, "term": "ua̋i-siat-tsuh", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/1z/gL/205341.mp3", "opts": ["摩托車、機車", "巧克力", "白襯衫", "控固力、混凝土"], "ans": 2, "explain": "白襯衫。借自日語「ワイシャツ(waishatsu)」。"}, {"id": 172, "term": "ùn-tsiàng", "audio": "https://sutian.moe.edu.tw/media/senn/mp3/imtong/oo/mh/205351.mp3", "opts": ["秋刀魚", "安全、放心、沒問題", "司機、運將", "吐司、白麵包"], "ans": 2, "explain": "司機、運將。借自日語「運ちゃん（うんちゃん）(unchan)」。"}];
const COUNT_OPTIONS = [
  { n: 5, label: "5 題" },
  { n: 7, label: "7 題" },
  { n: 9, label: "9 題" },
  { n: 11, label: "11 題" },
  { n: 13, label: "13 題" },
  { n: QUESTIONS.length, label: "全部" },
];
const LETTERS = ["A", "B", "C", "D"];

let selectedCount = null;
let bag = [];
let session = null; // indices, pos, correctCount, records

function buildCountGrid() {
  const grid = document.getElementById("count-grid");
  grid.innerHTML = "";
  COUNT_OPTIONS.forEach(opt => {
    const btn = document.createElement("div");
    btn.className = "count-btn";
    btn.innerHTML = opt.label + (opt.sub ? '<span class="count-sub">' + opt.sub + '</span>' : "");
    btn.onclick = () => selectCount(opt.n, btn);
    grid.appendChild(btn);
  });
}

function selectCount(n, btnEl) {
  selectedCount = n;
  document.querySelectorAll(".count-btn").forEach(b => b.classList.remove("selected"));
  btnEl.classList.add("selected");
  document.getElementById("start-btn").disabled = false;
}

// --- 不重複抽題袋：抽完所有題號才會重新洗牌 ---
function shuffledIndices() {
  const arr = QUESTIONS.map((_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function drawQuestions(n) {
  const result = [];
  while (result.length < n) {
    if (bag.length === 0) bag = shuffledIndices();
    result.push(bag.pop());
  }
  return result;
}

function startChallenge() {
  if (!selectedCount) return;
  const indices = drawQuestions(selectedCount);
  const records = indices.map(() => ({ solved: false, wrongSet: new Set() }));
  session = { indices, pos: 0, correctCount: 0, records };
  document.getElementById("screen-entry").classList.add("hidden");
  document.getElementById("screen-game").classList.remove("hidden");
  document.getElementById("hero-banner").classList.add("hidden");
  enterQuestion();
}

// 進入一題新題目時呼叫：畫面重繪 + 自動播放該詞讀音
function enterQuestion() {
  renderQuestion();
  playCurrentAudio();
}

function currentQuestion() {
  return QUESTIONS[session.indices[session.pos]];
}

function renderQuestion() {
  const q = currentQuestion();
  const record = session.records[session.pos];
  const total = session.indices.length;
  document.getElementById("progress-text").textContent = "第 " + (session.pos + 1) + " / " + total + " 題";
  document.getElementById("score-text").textContent = "答對 " + session.correctCount + " 題";
  document.getElementById("progress-fill").style.width = Math.round(((session.pos + 1) / total) * 100) + "%";
  document.getElementById("tailo-text").textContent = q.term;

  const optList = document.getElementById("opt-list");
  optList.innerHTML = "";
  q.opts.forEach((optText, i) => {
    const btn = document.createElement("button");
    btn.className = "opt-btn";
    btn.id = "opt-" + i;
    btn.innerHTML = '<span class="opt-letter">' + LETTERS[i] + '</span><span>' + optText.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
    btn.onclick = () => selectAnswer(i);
    if (record.wrongSet.has(i)) {
      btn.classList.add("wrong");
      btn.disabled = true;
    }
    if (record.solved && i === q.ans) {
      btn.classList.add("correct");
    }
    if (record.solved) {
      btn.disabled = true;
    }
    optList.appendChild(btn);
  });

  const feedback = document.getElementById("feedback-banner");
  const explainBox = document.getElementById("explain-box");
  if (record.solved) {
    feedback.textContent = "✅ 你著矣！";
    feedback.style.color = "var(--correct)";
    document.getElementById("explain-text").textContent = q.explain;
    explainBox.classList.add("show");
  } else if (record.wrongSet.size > 0) {
    feedback.textContent = "❌ 這毋著，繼續試看覓！";
    feedback.style.color = "var(--wrong)";
    explainBox.classList.remove("show");
  } else {
    feedback.textContent = "";
    explainBox.classList.remove("show");
  }

  document.getElementById("prev-btn").disabled = session.pos === 0;
  document.getElementById("next-btn").textContent = (session.pos === total - 1) ? "完成挑戰 🏁" : "下一題 ➡️";
}

function playCurrentAudio() {
  const q = currentQuestion();
  const audio = new Audio(q.audio);
  audio.play().catch(() => {});
}

function selectAnswer(i) {
  const q = currentQuestion();
  const record = session.records[session.pos];
  if (record.solved || record.wrongSet.has(i)) return;

  const isCorrect = i === q.ans;
  const sfx = document.getElementById(isCorrect ? "sfx-correct" : "sfx-wrong");
  sfx.currentTime = 0;
  sfx.play().catch(() => {});

  if (isCorrect) {
    record.solved = true;
    session.correctCount++;
  } else {
    record.wrongSet.add(i);
  }
  renderQuestion();
}

function prevQuestion() {
  if (session.pos === 0) return;
  session.pos--;
  enterQuestion();
}

function nextQuestion() {
  const total = session.indices.length;
  if (session.pos === total - 1) {
    finishChallenge();
    return;
  }
  session.pos++;
  enterQuestion();
}

function finishChallenge() {
  const total = session.indices.length;
  const correct = session.correctCount;
  const lastScore = document.getElementById("last-score");
  lastScore.textContent = "🏆 上一輪挑戰：" + correct + " / " + total + " 題正確";
  lastScore.classList.add("show");
  session = null;
  document.getElementById("screen-game").classList.add("hidden");
  document.getElementById("screen-entry").classList.remove("hidden");
  document.getElementById("hero-banner").classList.remove("hidden");
}

buildCountGrid();
</script>
